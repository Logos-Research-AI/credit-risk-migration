[project]
name = "credit-risk"
version = "0.1.0"
description = "Python/polars port of the SAS credit-risk pipeline (structure-preserving; see migration/legacy-to-port/RULEBOOK.md)"
requires-python = ">=3.13"
dependencies = [
    "polars==2.1.0",
    "numpy==2.5.4",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credit_risk"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["credit_risk"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false
